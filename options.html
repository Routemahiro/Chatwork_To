<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatwork 全員に返信 設定</title>
    <link rel="stylesheet" href="src/options.css">
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Chatwork 全員に返信</h1>
        <p class="lead">自分の Chatwork accountId を保存すると、全員に返信時の除外判定で最優先に使います。</p>

        <label class="field" for="selfAccountId">
          <span>自分の accountId</span>
          <input id="selfAccountId" name="selfAccountId" type="text" inputmode="numeric" autocomplete="off" placeholder="例: 807150">
        </label>

        <div class="actions">
          <button id="saveButton" type="button">保存</button>
          <p id="statusMessage" class="status" aria-live="polite"></p>
        </div>

        <p class="hint">accountId は Chatwork のプロフィール画像やメンション要素の <code>data-aid</code> に入っている値です。</p>
      </section>
    </main>

    <script src="src/options.js"></script>
  </body>
  </html>
